<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصروفاتي برو - السحابي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 text-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-wallet ml-2"></i>مصروفاتي برو</h1>
        <p class="text-xs text-blue-100 mt-1">إدارة المصاريف مع المزامنة السحابية الذكية</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Cloud Sync Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-700 mb-3"><i class="fa-brands fa-google text-blue-500 ml-1"></i> الربط السحابي (Google Drive)</h2>
            <div id="auth-section" class="flex flex-col gap-2">
                <button onclick="handleAuthClick()" class="w-full bg-blue-50 text-blue-600 border border-blue-200 py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-2 hover:bg-blue-100 transition">
                    <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول بحساب جوجل
                </button>
            </div>
            <div id="sync-section" class="hidden flex flex-col gap-2">
                <div class="flex items-center justify-between text-xs text-gray-500 bg-gray-50 p-2 rounded-lg">
                    <span id="user-email" class="truncate font-medium text-gray-700">متصل</span>
                    <button onclick="handleSignoutClick()" class="text-red-500 hover:underline">خروج</button>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button onclick="uploadToDrive()" class="bg-green-600 text-white py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 hover:bg-green-700 transition">
                        <i class="fa-solid fa-cloud-arrow-up"></i> رفع للدرايف
                    </button>
                    <button onclick="downloadFromDrive()" class="bg-indigo-600 text-white py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-cloud-arrow-down"></i> استعادة من الدرايف
                    </button>
                </div>
            </div>
        </div>

        <!-- Summary Card -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <p class="text-xs text-blue-100">إجمالي المصروفات</p>
                <h2 id="total-amount" class="text-2xl font-extrabold mt-1">0.00 ر.ي</h2>
            </div>
            <button onclick="openModal()" class="bg-white text-blue-600 px-4 py-2 rounded-xl font-bold text-sm shadow hover:bg-blue-50 transition">
                <i class="fa-solid fa-plus ml-1"></i> إضافة عملية
            </button>
        </div>

        <!-- Transactions List -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <h3 class="text-sm font-bold text-gray-700 mb-3">العمليات الأخيرة</h3>
            <div id="transactions-list" class="space-y-3">
                <!-- Transactions will be injected here -->
            </div>
        </div>

    </main>

    <!-- Modal Form -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-800">إضافة مصروف جديد</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="tx-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">المبلغ</label>
                    <input type="number" id="tx-amount" step="any" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">الوصف</label>
                    <input type="text" id="tx-desc" required placeholder="مثال: غداء، فاتورة كهرباء..." class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">تصوير الفاتورة / المستند (اختياري)</label>
                    <input type="file" id="tx-image" accept="image/*" capture="environment" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-gray-100 text-gray-600 py-2.5 rounded-xl text-sm font-medium">إلغاء</button>
                    <button type="submit" class="w-1/2 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-medium hover:bg-blue-700">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closeImageModal()">
        <img id="modal-img" class="max-w-full max-h-full rounded-lg shadow-2xl">
    </div>

    <script>
        const CLIENT_ID = '1048203524230-5gmgpb6t6j058nosms0bce0ch0hll69n.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        let tokenClient;
        let accessToken = null;

        let transactions = JSON.parse(localStorage.getItem('masrofati_txs')) || [];

        window.onload = function() {
            renderTransactions();
            initGoogleAuth();
        };

        function initGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        alert('فشل تسجيل الدخول');
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('sync-section').classList.remove('hidden');
                    document.getElementById('user-email').innerText = "تم الاتصال بنجاح ✓";
                },
            });
        }

        function handleAuthClick() {
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        function handleSignoutClick() {
            accessToken = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('sync-section').classList.add('hidden');
        }

        // Google Drive API Integration
        async function uploadToDrive() {
            if (!accessToken) { alert('يرجى تسجيل الدخول أولاً'); return; }
            
            const fileContent = JSON.stringify(transactions);
            const file = new Blob([fileContent], {type: 'application/json'});
            const metadata = {
                name: 'masrofati_backup.json',
                mimeType: 'application/json'
            };

            // Check if file already exists to update it, or create new
            try {
                const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='masrofati_backup.json' and trashed=false`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const searchData = await searchRes.json();
                
                let fileId = null;
                if (searchData.files && searchData.files.length > 0) {
                    fileId = searchData.files[0].id;
                }

                if (fileId) {
                    // Update existing file
                    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                        method: 'PATCH',
                        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                        body: fileContent
                    });
                } else {
                    // Create new file
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', file);

                    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${accessToken}` },
                        body: form
                    });
                }
                alert('تم رفع النسخة الاحتياطية إلى Google Drive بنجاح!');
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الرفع');
            }
        }

        async function downloadFromDrive() {
            if (!accessToken) { alert('يرجى تسجيل الدخول أولاً'); return; }
            try {
                const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='masrofati_backup.json' and trashed=false`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const searchData = await searchRes.json();
                
                if (!searchData.files || searchData.files.length === 0) {
                    alert('لا توجد نسخة احتياطية محفوظة في حسابك على الدرايف.');
                    return;
                }

                const fileId = searchData.files[0].id;
                const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const cloudData = await fileRes.json();
                
                transactions = cloudData;
                localStorage.setItem('masrofati_txs', JSON.stringify(transactions));
                renderTransactions();
                alert('تمت استعادة البيانات بنجاح!');
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الاستعادة');
            }
        }

        // App Logic
        function openModal() { document.getElementById('transaction-modal').classList.remove('hidden'); document.getElementById('transaction-modal').classList.add('flex'); }
        function closeModal() { document.getElementById('transaction-modal').classList.add('hidden'); document.getElementById('transaction-modal').classList.remove('flex'); document.getElementById('tx-form').reset(); }

        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const desc = document.getElementById('tx-desc').value;
            const imageFile = document.getElementById('tx-image').files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveTx(amount, desc, uploadEvent.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                saveTx(amount, desc, null);
            }
        }

        function saveTx(amount, desc, image) {
            const newTx = {
                id: Date.now(),
                amount,
                desc,
                date: new Date().toLocaleDateString('ar-SA'),
                image
            };
            transactions.unshift(newTx);
            localStorage.setItem('masrofati_txs', JSON.stringify(transactions));
            renderTransactions();
            closeModal();
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('masrofati_txs', JSON.stringify(transactions));
            renderTransactions();
        }

        function renderTransactions() {
            const listEl = document.getElementById('transactions-list');
            let total = 0;
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-400 text-xs py-4">لا توجد عمليات مسجلة</p>`;
                document.getElementById('total-amount').innerText = '0.00 ر.ي';
                return;
            }

            transactions.forEach(t => {
                total += t.amount;
                listEl.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div class="flex items-center gap-3">
                            ${t.image ? `<img src="${t.image}" class="w-10 h-10 object-cover rounded-lg cursor-pointer border" onclick="showImage('${t.image}')">` : '<div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-receipt"></i></div>'}
                            <div>
                                <h4 class="text-sm font-semibold text-gray-800">${t.desc}</h4>
                                <span class="text-[10px] text-gray-400">${t.date}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-bold text-red-600">-${t.amount}</span>
                            <button onclick="deleteTx(${t.id})" class="text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-amount').innerText = total.toLocaleString() + ' ر.ي';
        }

        function showImage(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('image-modal').classList.add('flex');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('image-modal').classList.remove('flex');
        }
    </script>
</body>
</html>
